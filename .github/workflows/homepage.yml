name: Homepage

# Publishes website/ to GitHub Pages at whittle.aylith.com (both / and /home/),
# together with the packed CLI under /downloads/ so the homepage's install
# command works before whittle is on the npm registry.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'schema/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.github/workflows/homepage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint, typecheck and test
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build and pack the CLI
        run: |
          bun run build
          mkdir -p _site/downloads _site/home
          npm pack --pack-destination _site/downloads
          tarball="aylith-whittle-$(node -p 'require("./package.json").version').tgz"
          test -f "_site/downloads/$tarball"
          grep -q "/downloads/$tarball" website/index.html || {
            echo "website/index.html does not link $tarball; update the install command" >&2
            exit 1
          }
          (cd _site/downloads && sha256sum "$tarball" > SHA256SUMS)

      - name: Smoke-test the packed CLI
        run: |
          prefix="$(mktemp -d)"
          npm install -g --prefix "$prefix" _site/downloads/aylith-whittle-*.tgz
          "$prefix/bin/whittle" --version

      - name: Assemble the site
        run: |
          cp website/index.html website/styles.css website/favicon.svg website/og.png _site/
          cp website/index.html _site/home/index.html
          echo whittle.aylith.com > _site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
